        <p id = "zoom">100%</p>
        <p id = "pos">x: 0, y: 0</p>
        <svg id = "mySVG" xmlns="http://www.w3.org/2000/svg">
            <!-- <circle cx="50" cy="50" r="20" fill="blue" /> -->
        </svg>
        <script>

            const d = [[50.0, 0.0], [25.0, 43.3], [-25.0, 43.3], [-50.0, 0.0], [-25.0, -43.3], [25.0, -43.3]];

            function newHexagon(x, y, category) {
                let p = document.createElementNS('http://www.w3.org/2000/svg', 'path');

                let h = d.map(pair => `${pair[0] + x},${pair[1] + y}`)

                p.setAttribute('id', category)
                p.setAttribute('d', `M${h[0]} L${h[1]} L${h[2]} L${h[3]} L${h[4]} L${h[5]} Z`)

                document.getElementById('mySVG').appendChild(p);
            } 

            let x = innerWidth/2;
            let y = innerHeight/2;

            let c = 7;

            let categories = ['WITCHERY', 'BLOODMAGIC', 'WITCHGADG', 'WT_Category', 'THAUMIC_MACHINA_CAT', 'THAUMICINSURGENCE', 'ThaumicHorizons', 'THAUMICBOOTS', 'RBRINGS', 'TX', 'THAUMICBASES', 'TM', 'gadomancy', 'EMT', 'botanichorizons', 'MAGICBEES', 'FORBIDDEN', 'TT_CATEGORY', 'AUTOMAGY', 'NEWHORIZONS', 'thaumicenergistics', 'ELDRITCH', 'GOLEMANCY', 'ARTIFICE', 'ALCHEMY', 'THAUMATURGY', 'BASICS'];

            newHexagon(x - 60, y + 30 + c, categories.pop());
            newHexagon(x + 60, y + 30 + c, categories.pop());
            newHexagon(x      ,y - 74 + c, categories.pop());

            for (let i = 0; i < 2*Math.PI; i += 2*Math.PI/8) {
                let r = 190;
                
                let hx = x + r * Math.sin(i);
                let hy = y + r * Math.cos(i);

                newHexagon(hx, hy, categories.pop())
            }

            for (let i = 0; i < 2*Math.PI; i += 2*Math.PI/16) {
                let r = 320;
                
                let hx = x + r * Math.sin(i);
                let hy = y + r * Math.cos(i);

                newHexagon(hx, hy, categories.pop())
            }

            // let c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');

            // c.setAttribute("cx", 100)
            // c.setAttribute("cy", 100)
            // c.setAttribute("r", 20)
            // c.setAttribute("fill", "white")

            // document.getElementById('mySVG').appendChild(c);
        </script>
