<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GTNH Tc4 Map</title>
    </head>
    <body>
        <canvas id="myCanvas" width="500" height="300" style="border:1px solid #ccc;">
            
        </canvas>
        <script>
            // 1. Get the canvas element and its 2D rendering context
            const canvas = document.getElementById('myCanvas');
            const ctx = canvas.getContext('2d');
            
            // --- DRAWING A FILLED CIRCLE ---
            ctx.beginPath();                  // Start a new path (crucial for separating shapes)
            ctx.arc(150, 150, 60, 0, 2 * Math.PI); // Center at (150,150), radius 60
            ctx.fillStyle = '#3498db';        // Set fill color (Blue)
            ctx.fill();                       // Fill the circle interior
            
            // --- DRAWING AN OUTLINED CIRCLE ---
            ctx.beginPath();                  // Start a fresh path
            ctx.arc(350, 150, 60, 0, 2 * Math.PI); // Center at (350,150), radius 60
            ctx.lineWidth = 5;                // Set border thickness
            ctx.strokeStyle = '#e74c3c';      // Set border color (Red)
            ctx.stroke();                     // Draw the outline
        </script>
    </body>
</html>
